# Deploys a site to GitHub Pages and stamps version.json with the commit and build time.
# General deploys itself with it, and every app calls it from a short .github/workflows/pages.yml
# (template: github/workflows/pages.yml), so a fix here reaches every app's next deploy. See STANDARDS.md,
# "Version and build info". Keep it backward compatible: apps call it at @main.
# Deploys only once Settings → Pages → Source is "GitHub Actions" (./github/apply-ruleset.sh switches it for repos
# that have this file). Until then it checks, says so in the log and stops, and Pages keeps deploying from the branch.
name: Deploy to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
# Deploys queue one at a time and are never cancelled half-way (a newer push still replaces one that hasn't
# started): GitHub's advice for Pages, since a cancelled deploy can leave the site's deployment stuck.
concurrency:
  group: pages
  cancel-in-progress: false
# Two jobs, as in GitHub's own Pages workflows. The artifact list deploy-pages reads lags a moment behind the
# upload, and asking in the same second as the upload sometimes finds nothing ("No artifacts named github-pages"),
# which failed real deploys. The job boundary gives it time, and one retry after a pause covers the rest.
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.mode.outputs.on }}
    steps:
      - name: Is Pages set to deploy from Actions?
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bt=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo none)
          echo "Pages source: $bt"
          if [ "$bt" = workflow ]; then echo "on=yes" >> "$GITHUB_OUTPUT"; else echo "::notice::Pages deploys from the branch, so this run stops here. Run ./github/apply-ruleset.sh to switch it."; fi
      - if: steps.mode.outputs.on == 'yes'
        uses: actions/checkout@v4
      - name: Stamp version.json
        if: steps.mode.outputs.on == 'yes'
        run: |
          node -e '
            const fs = require("fs");
            let v = {};
            try { v = JSON.parse(fs.readFileSync("version.json", "utf8")); } catch (e) {}
            v.commit = process.env.GITHUB_SHA;
            v.built = new Date().toISOString().replace(/\.\d+Z$/, "Z");
            v.repo = process.env.GITHUB_REPOSITORY;
            fs.writeFileSync("version.json", JSON.stringify(v, null, 2) + "\n");
            console.log(v);
          '
      - if: steps.mode.outputs.on == 'yes'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.on == 'yes'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    if: needs.build.outputs.on == 'yes'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait, then try once more
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::The first deploy attempt failed (often the artifact isn't listed yet). Trying again in 20 seconds."
          sleep 20
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
