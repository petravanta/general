# Deploys this app to GitHub Pages and stamps version.json, using the shared workflow in petravanta/general,
# so fixes to deploying reach every app by themselves. Copy to .github/workflows/pages.yml in each app, unchanged.
# (No concurrency block here: the shared workflow has one, and the same group in both would block itself.)
# See STANDARDS.md, "Version and build info".
name: Deploy to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    uses: petravanta/general/.github/workflows/pages.yml@main
